[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qr-phishing-shield"
version = "0.1.0"
description = "Explainable QR URL inspection — Computer Networks course prototype"
requires-python = ">=3.12"
dependencies = [
  "streamlit>=1.50,<2",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=11,<13",
  "numpy>=2,<3",
  "tldextract>=5.1,<6",
  "idna>=3.10,<4",
  "urllib3>=2.3,<3",
  "certifi>=2024.8.30",
  "dnspython>=2.7,<3",
  "qrcode>=8,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.setuptools]
py-modules = ["pipeline", "demo_cases", "cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "qr_input*", "url_analysis*", "redirect_analysis*", "network_analysis*", "scoring*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
